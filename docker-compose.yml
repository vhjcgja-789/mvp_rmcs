# mvp_rmcs — 构建镜像 + CLI 通道(Dev Containers 用 .devcontainer/docker-compose.yml)
services:
  mvp_rmcs:
    build: .
    image: mvp_rmcs:jazzy
    user: "1000:1000"
    network_mode: host
    init: true
    command: /bin/sh -c "while sleep 1000; do :; done"
    working_dir: /workspaces/mvp_rmcs
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_X11_NO_MITSHM=1
      - TZ=Asia/Shanghai
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    volumes:
      - .:/workspaces/mvp_rmcs:bind
      - /tmp/.X11-unix:/tmp/.X11-unix
