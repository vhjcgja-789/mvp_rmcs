# 阶段 7 机器人规格:只演示"契约 + 规格 + 自动接线 + 启动校验"骨架,不含控制。
# launch 生成器是唯一解析者:读 components → 生成容器节点 + 推导期望话题给校验器。
# 接线约定与组件代码一致:接口 (joint, interface) → 话题 /{robot}/{joint}/{interface}。
robot: stage7_demo

components:
  - type: mvp_core::template_::TemplateSource
    name: source
    produces:
      - {joint: yaw, interface: position}
  - type: mvp_core::template_::TemplateProcessor
    name: processor
    claims:
      - {joint: yaw, interface: position}
    produces:
      - {joint: yaw, interface: command}

# 运行参数仍按节点全名分区(与阶段 6 约定一致)。
/stage7_demo/source:
  ros__parameters:
    period: 0.5
